name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test tooling
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Python syntax and undefined names
        run: uv run --frozen --extra dev ruff check src scripts tools tests --select F,E9
      - name: Async safety
        run: uv run --frozen --extra dev python scripts/lint_async_safety.py .
      - name: Subscription and panel leakage checks
        run: uv run --frozen --extra dev python scripts/lint_3xui_guardrails.py .
      - name: Offline application tests
        run: uv run --frozen --extra dev python tools/run_offline_tests.py
